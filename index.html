<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퇴사자 설문</title>
</head>
<body>
<style>
  :root{
    --bg:#F2F4F3;
    --card:#FFFFFF;
    --ink:#1B2622;
    --muted:#68746E;
    --line:#DFE5E1;
    --accent:#2E6B5A;
    --accent-deep:#245447;
    --accent-soft:#E7F0EC;
    --danger:#B4552D;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);
    font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .progress{position:fixed;top:0;left:0;right:0;height:4px;background:var(--line);z-index:10}
  .progress i{display:block;height:100%;width:0%;background:var(--accent);transition:width .4s cubic-bezier(.4,0,.2,1)}
  .wrap{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 22px}
  .topbar{display:flex;align-items:center;justify-content:space-between;height:64px;flex:none}
  .back{width:40px;height:40px;border:none;background:none;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);visibility:hidden}
  .back:hover{background:var(--accent-soft);color:var(--accent-deep)}
  .back:focus-visible,.opt:focus-visible,.btn:focus-visible,.dot:focus-visible,.oxcard:focus-visible,.select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .count{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0;font-variant-numeric:tabular-nums}
  .screen{flex:1;display:flex;flex-direction:column;padding-bottom:40px;animation:rise .35s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none}.progress i{transition:none}}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:0;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
  .step{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:10px}
  h1{font-size:27px;font-weight:800;letter-spacing:0;line-height:1.3;text-wrap:pretty;margin-bottom:14px}
  h2{font-size:21px;font-weight:750;letter-spacing:0;line-height:1.4;text-wrap:pretty;margin-bottom:6px}
  h1,h2,.lead,.hint,.privacy p,.guide p,.opt span:first-child,.scalelab span,.done p{word-break:keep-all;overflow-wrap:break-word}
  .keep-phrase{white-space:nowrap}
  .lead{font-size:15px;color:var(--ink);margin-bottom:18px}
  .hint{font-size:14px;color:var(--muted);margin-bottom:22px}
  .privacy{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px;display:flex;gap:12px;margin:8px 0 28px}
  .privacy svg{flex:none;margin-top:2px}
  .privacy p{font-size:14px;color:var(--muted)}
  .guide{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}
  .guide p{font-size:14.5px;color:var(--muted)}
  .guide p+p{margin-top:10px}
  .meta{font-size:13px;color:var(--muted);margin-bottom:14px}
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .opt{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    width:100%;text-align:left;font:inherit;font-size:16px;font-weight:550;color:var(--ink);
    background:var(--card);border:1.5px solid var(--line);border-radius:14px;
    padding:15px 18px;cursor:pointer;transition:border-color .15s,background .15s;
  }
  .opt:hover{border-color:var(--accent)}
  .opt.on{border-color:var(--accent);background:var(--accent-soft)}
  .opt .mark{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;transition:all .15s}
  .opt.on .mark{border-color:var(--accent);background:var(--accent)}
  .opt.on .mark::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
  .select{
    appearance:none;-webkit-appearance:none;width:100%;margin-top:16px;
    font:inherit;font-size:16px;font-weight:550;color:var(--ink);
    background:var(--card) url("data:image/svg+xml;charset=utf-8,%3Csvg width='14' height='9' viewBox='0 0 14 9' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5 7 7.5 13 1.5' stroke='%2368746E' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right 18px center;
    border:1.5px solid var(--line);border-radius:14px;padding:16px 44px 16px 18px;cursor:pointer;
  }
  .select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .select.placeholder{color:var(--muted)}
  .etcrow{display:flex;gap:8px;margin-top:2px}
  .etcrow input{flex:1;font:inherit;font-size:16px;padding:13px 16px;border:1.5px solid var(--accent);border-radius:14px;background:var(--card);color:var(--ink)}
  .etcrow input:focus{outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
  .scale{display:flex;justify-content:space-between;gap:8px;margin:26px 0 10px}
  .dot{
    flex:1;aspect-ratio:1;max-width:58px;border-radius:50%;border:1.5px solid var(--line);
    background:var(--card);font:inherit;font-size:17px;font-weight:650;color:var(--ink);
    cursor:pointer;transition:all .15s;
  }
  .dot:hover{border-color:var(--accent)}
  .dot.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .scalelab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
  textarea{
    width:100%;min-height:130px;font:inherit;font-size:16px;line-height:1.6;color:var(--ink);
    background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px 17px;
    resize:vertical;margin-top:16px;
  }
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .oxrow{display:flex;gap:12px;margin-top:20px}
  .oxcard{
    flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:18px;
    padding:26px 10px 20px;text-align:center;cursor:pointer;font:inherit;transition:all .15s;
  }
  .oxcard:hover{border-color:var(--accent)}
  .oxcard.on{border-color:var(--accent);background:var(--accent-soft)}
  .oxcard b{display:block;font-size:34px;font-weight:800;letter-spacing:0;margin-bottom:6px;color:var(--accent-deep)}
  .oxcard.no b{color:var(--danger)}
  .oxcard span{font-size:13.5px;color:var(--muted)}
  .btn{
    width:100%;border:none;border-radius:14px;padding:16px;margin-top:auto;
    font:inherit;font-size:16.5px;font-weight:700;letter-spacing:0;
    background:var(--accent);color:#fff;cursor:pointer;transition:background .15s;flex:none;
  }
  .btn:hover{background:var(--accent-deep)}
  .btn.secondary{background:var(--card);color:var(--accent-deep);border:1.5px solid var(--line)}
  .btn.secondary:hover{background:var(--accent-soft);border-color:var(--accent)}
  .btn:disabled{background:var(--line);color:var(--muted);cursor:default}
  .nav{display:grid;grid-template-columns:minmax(96px,.72fr) minmax(0,1.28fr);gap:10px;width:100%;flex:none}
  .nav .btn{margin-top:0}
  .spacer{flex:1;min-height:28px}
  .done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding-bottom:80px}
  .done .ring{width:72px;height:72px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
  .done h2{margin-bottom:2px}
  .done p{font-size:14.5px;color:var(--muted)}
  .selcount{font-size:13px;font-weight:600;color:var(--accent);margin-top:12px;font-variant-numeric:tabular-nums}
</style>

<div class="progress" aria-hidden="true"><i id="bar"></i></div>
<div class="wrap">
  <div class="topbar">
    <button class="back" id="backBtn" aria-label="이전 질문으로">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4 6.5 10l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="count" id="count"></span>
  </div>
  <div id="screen" class="screen"></div>
</div>

<script>
const FLOW = [
  {id:'pos', step:'1단계 · 기본 정보', title:'재직 당시 마지막 직위는 무엇이었나요?', type:'select',
   options:['사원','주임','대리','과장','차장','부장','임원']},
  {id:'ten', step:'1단계 · 기본 정보', title:'회사에 재직한 기간은 얼마나 되었나요?', type:'choice',
   options:['3년 미만','3년~5년','5년 이상']},
  {id:'q1', step:'1단계 · 기본 정보', title:'퇴사 후에는 어떤 계획을 갖고 계세요?', type:'choice',
   options:['이직','학업','창업','휴식','개인 사유'], etc:true},
  {id:'q2', step:'1단계 · 기본 정보', title:'퇴사를 결심하는 과정에서 여러 이유가 있었겠지만, 최종 마음을 굳히는 데 가장 크게 작용한<br><span class="keep-phrase">한 가지는 무엇이었나요?</span>', type:'choice',
   options:['보상','직무','커리어','워라밸','관리자','문화','비젼'], etc:true},
  {id:'experience_intro', step:'다음 화면 안내', title:'이제 회사에서 일하셨던 경험을 여쭤보려 합니다.', type:'info',
   body:['다음 문항은 일하는 동안 어떤 경험이 퇴사 결정에 영향을 주었는지 더 정확히 이해하기 위한 질문이에요.','재직 기간 동안 전반적인 느낌과 가장 가까운 점수를 선택해주세요.']},
  {id:'q3', step:'2단계 · 회사생활 경험', title:'업무를 수행하는 동안, 내가 맡아야 할 역할과 회사가 나에게 기대하는 결과가 무엇인지 충분히 이해할 수 있었나요?', type:'scale'},
  {id:'q4', step:'2단계 · 회사생활 경험', title:'업무 과정에서 관리자가 내 의견과 노력을 존중하고 있다고 느꼈나요?', type:'scale'},
  {id:'q5', step:'2단계 · 회사생활 경험', title:'주어진 업무량과 일하는 방식은 건강과 일상을 해치지 않고 지속할 수 있는 수준이었나요?', type:'scale'},
  {id:'q6', step:'2단계 · 회사생활 경험', title:'퇴사를 결정하기 전, 회사가 아래와 같은 변화를 제안하거나 실제로 지원했다면 퇴사를 다시 고민해볼 가능성이 있었던 항목은 무엇인가요?',
   hint:'최대 2개까지 선택해주세요.', type:'multi', max:2,
   options:['보상 및 복리후생','커리어 성장 기회','업무량 및 방식 조정','동료 및 관리자 관계 개선','조직 문화 변화'], etc:true},
  {id:'freeform_intro', step:'다음 화면 안내', title:'회사에서 겪은 경험과 앞으로 개선되었으면 하는 점을 편하게 들려주세요.', type:'info', body:[]},
  {id:'q7', step:'3단계 · 자유의견', title:'재직 기간 동안 가장 아쉽거나 힘들었던 점은 무엇이었나요?', type:'text'},
  {id:'q8', step:'3단계 · 자유의견', title:'회사가 가장 먼저 바꿔야 할 한 가지는 무엇이라고 생각하시나요?', type:'text'},
  {id:'q9', step:'3단계 · 자유의견', title:'키움증권을 지인에게 추천하고 싶으신가요?', type:'ox'},
];
const QUESTION_TOTAL = FLOW.filter(item => item.type !== 'info').length;
const answers = {};
let idx = -1;

const $screen = document.getElementById('screen');
const $bar = document.getElementById('bar');
const $count = document.getElementById('count');
const $back = document.getElementById('backBtn');
$back.addEventListener('click', () => go(idx - 1));

function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }

function go(i){
  idx = i;
  $screen.innerHTML = '';
  $screen.style.animation='none'; void $screen.offsetWidth; $screen.style.animation='';
  $back.style.visibility = (idx >= 0 && idx < FLOW.length) ? 'visible' : 'hidden';
  if (idx === -1) { $bar.style.width='0%'; $count.textContent=''; renderIntro(); }
  else if (idx >= FLOW.length) { $bar.style.width='100%'; $count.textContent=''; renderDone(); }
  else {
    const item = FLOW[idx];
    const answeredBefore = FLOW.slice(0, idx).filter(q => q.type !== 'info').length;
    const questionNo = answeredBefore + (item.type === 'info' ? 0 : 1);
    $bar.style.width = (answeredBefore / QUESTION_TOTAL * 100) + '%';
    $count.textContent = item.type === 'info' ? '' : questionNo + ' / ' + QUESTION_TOTAL;
    renderQuestion(item);
  }
  window.scrollTo(0,0);
}

function renderIntro(){
  $screen.append(
    el('h1',null,'퇴사자 설문'),
    el('p','lead','안녕하세요. 인사팀입니다.<br><br>그동안 회사와 함께해 주신 시간과 노력에 진심으로 감사드립니다.'),
    el('p','lead','이번 설문은 재직 기간 동안의 경험을 솔직하게 듣고, 앞으로 더 나은 근무 환경을 만드는 데 참고하기 위한 목적으로 진행됩니다.'),
  );
  const pv = el('div','privacy');
  pv.append(el('span',null,
    '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="4" y="8.5" width="12" height="8" rx="2" stroke="#2E6B5A" stroke-width="1.6"/><path d="M7 8.5V6.5a3 3 0 0 1 6 0v2" stroke="#2E6B5A" stroke-width="1.6"/></svg>'));
  pv.append(el('p',null,'응답은 익명으로 수집되며, 통계 용도로만 활용할 예정입니다.<br><br>편하게 응답해주시면 감사하겠습니다.'));
  $screen.append(
    pv,
    el('p','meta','작성에는 약 5~8분 정도 소요되며, 언제든 원하시는 만큼만 답변하셔도 괜찮습니다.'),
    el('p','lead','마지막까지 함께 해 주셔서 감사드립니다.<br>앞으로의 여정을 진심으로 응원하겠습니다.'),
    el('div','spacer')
  );
  const b = el('button','btn','시작하기');
  b.addEventListener('click', () => go(0));
  $screen.append(b);
}

function renderQuestion(q){
  $screen.append(el('p','step',q.step), el('h2',null,q.title));
  if (q.hint) $screen.append(el('p','hint',q.hint));
  if (q.type==='info') renderInfo(q);
  else if (q.type==='select') renderSelect(q);
  else if (q.type==='choice') renderChoice(q);
  else if (q.type==='scale') renderScale(q);
  else if (q.type==='multi') renderMulti(q);
  else if (q.type==='text') renderText(q);
  else if (q.type==='ox') renderOX(q);
}

function appendNav(onNext, label='다음', disabled=false){
  const nav = el('div','nav');
  const prev = el('button','btn secondary','이전');
  const next = el('button','btn',label);
  next.disabled = disabled;
  prev.addEventListener('click', () => go(idx-1));
  next.addEventListener('click', onNext);
  nav.append(prev, next);
  $screen.append(el('div','spacer'), nav);
  return next;
}

function renderInfo(q){
  if ((q.body || []).length) {
    const guide = el('div','guide');
    q.body.forEach(text => guide.append(el('p',null,text)));
    $screen.append(guide);
  }
  appendNav(() => go(idx+1));
}

function renderSelect(q){
  const s = el('select','select placeholder');
  const ph = el('option'); ph.textContent='눌러서 선택해주세요'; ph.value=''; ph.disabled=true;
  s.append(ph);
  let hasSaved = false;
  q.options.forEach(o => {
    const op = el('option'); op.value=o; op.textContent=o;
    if (answers[q.id]===o) { op.selected=true; hasSaved=true; }
    s.append(op);
  });
  if (!hasSaved) ph.selected = true; else s.classList.remove('placeholder');
  s.addEventListener('change', () => {
    if (!s.value) return;
    s.classList.remove('placeholder');
    answers[q.id] = s.value;
    next.disabled = false;
  });
  $screen.append(s);
  const next = appendNav(() => go(idx+1), '다음', !hasSaved);
}

function renderChoice(q){
  const box = el('div','opts');
  const saved = answers[q.id] || '';
  let selected = saved.indexOf('기타:')===0 ? '__etc' : saved;
  let etcInput = null;
  let next = null;
  const refresh = () => {
    box.querySelectorAll('.opt').forEach(b => b.classList.toggle('on', b.dataset.value === selected));
    if (next) next.disabled = !selected;
  };
  const mk = (label, value=label) => {
    const b=el('button','opt','<span>'+label+'</span><span class="mark"></span>');
    b.dataset.value=value; box.append(b); return b;
  };
  q.options.forEach(label => {
    const b = mk(label);
    b.addEventListener('click', () => {
      selected=label;
      answers[q.id]=label;
      if (etcInput) etcInput.parentElement.style.display='none';
      refresh();
    });
  });
  if (q.etc){
    const b = mk('기타','__etc');
    const row = el('div','etcrow'); row.style.display='none';
    const inp = el('input'); inp.placeholder='편하게 적어주세요'; inp.type='text';
    etcInput = inp;
    row.append(inp); box.append(row);
    if (selected==='__etc') { row.style.display='flex'; inp.value=saved.slice(3).trim(); }
    b.addEventListener('click', () => {
      selected='__etc'; answers[q.id]='기타: '+inp.value.trim(); row.style.display='flex'; inp.focus(); refresh();
    });
    inp.addEventListener('input', () => { answers[q.id]='기타: '+inp.value.trim(); });
  }
  $screen.append(box);
  next = appendNav(() => {
    if (selected==='__etc') {
      if (!etcInput.value.trim()) { etcInput.focus(); return; }
      answers[q.id]='기타: '+etcInput.value.trim();
    } else {
      answers[q.id]=selected;
    }
    go(idx+1);
  }, '다음', !selected);
  refresh();
}

function renderScale(q){
  const sc = el('div','scale');
  for (let v=1; v<=5; v++){
    const d = el('button','dot',String(v));
    if (answers[q.id]===v) d.classList.add('on');
    d.addEventListener('click', () => {
      sc.querySelectorAll('.dot').forEach(x=>x.classList.remove('on'));
      d.classList.add('on'); answers[q.id]=v; next.disabled=false;
    });
    sc.append(d);
  }
  $screen.append(sc, el('div','scalelab','<span>전혀 그렇지 않다</span><span>매우 그렇다</span>'));
  const next = appendNav(() => go(idx+1), '다음', !answers[q.id]);
}

function renderMulti(q){
  const box = el('div','opts');
  const sel = new Set(answers[q.id] || []);
  let etcVal = '';
  (answers[q.id]||[]).forEach(v => { if(v.indexOf('기타:')===0) etcVal=v; });
  if (etcVal) sel.delete(etcVal);
  const cnt = el('p','selcount');
  let next = null;
  let etcInp = null;
  const persist = () => {
    const out = [];
    sel.forEach(v => { if(v!=='__etc') out.push(v); });
    if (sel.has('__etc')) out.push('기타: '+(etcInp ? etcInp.value.trim() : ''));
    answers[q.id] = out;
  };
  const refresh = () => {
    cnt.textContent = sel.size + ' / ' + q.max + ' 선택됨';
    if (next) next.disabled = sel.size === 0;
    persist();
  };
  const mk = label => { const b=el('button','opt','<span>'+label+'</span><span class="mark"></span>'); box.append(b); return b; };
  q.options.forEach(label => {
    const b = mk(label);
    if (sel.has(label)) b.classList.add('on');
    b.addEventListener('click', () => {
      if (sel.has(label)) { sel.delete(label); b.classList.remove('on'); }
      else if (sel.size < q.max) { sel.add(label); b.classList.add('on'); }
      refresh();
    });
  });
  if (q.etc){
    const b = mk('기타');
    const row = el('div','etcrow'); row.style.display='none';
    etcInp = el('input'); etcInp.placeholder='편하게 적어주세요'; etcInp.type='text';
    row.append(etcInp); box.append(row);
    if (etcVal) { b.classList.add('on'); row.style.display='flex'; etcInp.value=etcVal.slice(3).trim(); sel.add('__etc'); }
    b.addEventListener('click', () => {
      const on = b.classList.contains('on');
      if (on) { b.classList.remove('on'); row.style.display='none'; sel.delete('__etc'); }
      else if (sel.size < q.max) { b.classList.add('on'); row.style.display='flex'; sel.add('__etc'); etcInp.focus(); }
      refresh();
    });
    etcInp.addEventListener('input', persist);
  }
  $screen.append(box, cnt);
  next = appendNav(() => {
    const out = [];
    sel.forEach(v => { if(v!=='__etc') out.push(v); });
    if (sel.has('__etc')) {
      if (!etcInp.value.trim()) { etcInp.focus(); return; }
      out.push('기타: '+etcInp.value.trim());
    }
    answers[q.id] = out; go(idx+1);
  }, '다음', sel.size === 0);
  refresh();
}

function renderText(q){
  const ta = el('textarea'); ta.placeholder='편하게 적어주세요.';
  ta.value = answers[q.id] || '';
  ta.addEventListener('input', () => { answers[q.id]=ta.value; });
  $screen.append(ta);
  appendNav(() => { answers[q.id]=ta.value.trim(); go(idx+1); });
}

function renderOX(q){
  const row = el('div','oxrow');
  const yes = el('button','oxcard','<b>O</b><span>네, 추천하고 싶어요</span>');
  const no  = el('button','oxcard no','<b>X</b><span>아니요</span>');
  if (answers[q.id]==='O') yes.classList.add('on');
  if (answers[q.id]==='X') no.classList.add('on');
  const pick = (card, val) => {
    yes.classList.remove('on'); no.classList.remove('on');
    card.classList.add('on'); answers[q.id]=val;
    next.disabled=false;
  };
  yes.addEventListener('click', () => pick(yes,'O'));
  no.addEventListener('click', () => pick(no,'X'));
  row.append(yes,no); $screen.append(row);
  const next = appendNav(submit, '제출하기', !answers[q.id]);
}

// 응답 접수 주소 (Apps Script 웹 앱). 응답은 구글 시트 '응답' 탭에 저장됩니다.
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbyu1Tp4B8fdQwP2IK-ueGZ0xsR5LPSJrC-u2cYvTjcDnM7V1Y3nBa-yH7ZUOrnvWBi8nw/exec';

function submit(){
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(() => go(FLOW.length))
      .withFailureHandler(() => { alert('제출 중 문제가 생겼어요. 한 번만 다시 시도해주세요.'); go(FLOW.length - 1); })
      .submitResponse(answers);
    return;
  }
  if (ENDPOINT) {
    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(answers)
    })
      .then(() => go(FLOW.length))
      .catch(() => { alert('제출 중 문제가 생겼어요. 인터넷 연결을 확인하고 한 번만 다시 시도해주세요.'); go(FLOW.length - 1); });
    return;
  }
  setTimeout(() => go(FLOW.length), 400);
}

function renderDone(){
  const d = el('div','done');
  d.append(
    el('div','ring','<svg width="30" height="30" viewBox="0 0 30 30" fill="none"><path d="M6 15.5 12.5 22 24 9" stroke="#2E6B5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'),
    el('h2',null,'제출되었어요'),
    el('p',null,'귀한 시간을 내어 솔직한 이야기 들려주셔서 감사합니다.<br>남겨 주신 의견은 더 나은 회사를 만드는 데 소중히 활용하겠습니다.'),
  );
  $screen.append(d);
}

go(-1);
</script>
